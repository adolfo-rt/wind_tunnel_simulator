<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wind Tunnel Simulator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e13'/%3E%3Cpath d='M16 5l1.6 9.2 8.4 3.1v2l-8.4-1.4-.7 5.4 3 2.1v1.3L16 25.6l-3.9 1.1v-1.3l3-2.1-.7-5.4L6 19.3v-2l8.4-3.1z' fill='%234da3ff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="An interactive 3D wind tunnel for commercial airliners, from the de Havilland Comet to the Airbus A350."
    />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>

      <aside id="selector" class="panel">
        <header class="panel-header">
          <h1>Wind Tunnel</h1>
          <p class="subtitle">Commercial airliners, 1949 to today</p>
        </header>
        <div id="aircraft-list" class="aircraft-list"></div>
      </aside>

      <section id="info" class="panel info-panel" hidden>
        <div class="info-head">
          <span class="info-year" id="info-year"></span>
          <h2 id="info-name"></h2>
          <p class="info-maker" id="info-maker"></p>
        </div>
        <p class="info-innovation" id="info-innovation"></p>
        <dl class="info-stats" id="info-stats"></dl>
        <p class="info-note">Dimensions are published figures.</p>
      </section>

      <section id="controls" class="panel controls-panel" hidden>
        <div class="speed-head">
          <div class="speed-readout">
            <span class="speed-value" id="speed-value">900</span>
            <span class="speed-unit">km/h</span>
          </div>
          <button type="button" id="speed-cruise" class="chip">
            Match cruise Mach
          </button>
        </div>
        <input
          type="range"
          id="speed-slider"
          class="speed-slider"
          min="0"
          max="1300"
          step="10"
          value="900"
          aria-label="Tunnel airspeed in kilometres per hour"
        />
        <dl class="readouts" id="readouts"></dl>

        <div class="flow-controls" id="flow-controls">
          <div class="flow-head">
            <label class="switch">
              <input type="checkbox" id="streamlines-enabled" checked />
              <span>Streamlines</span>
            </label>
            <div
              class="axis-group"
              id="streamline-density"
              role="group"
              aria-label="Number of streamlines"
            >
              <button type="button" class="axis" data-density="low" aria-pressed="false">
                1k
              </button>
              <button type="button" class="axis" data-density="medium" aria-pressed="true">
                4k
              </button>
              <button type="button" class="axis" data-density="high" aria-pressed="false">
                16k
              </button>
            </div>
          </div>
          <p class="flow-note" id="streamline-note"></p>

          <div class="flow-head">
            <label class="switch">
              <input type="checkbox" id="slice-enabled" />
              <span>Flow slice</span>
            </label>
            <div
              class="axis-group"
              id="slice-axes"
              role="group"
              aria-label="Slice orientation"
            >
              <button
                type="button"
                class="axis"
                data-axis="z"
                aria-pressed="true"
                title="Slice along the span. Click to recentre."
              >
                Span
              </button>
              <button
                type="button"
                class="axis"
                data-axis="y"
                aria-pressed="false"
                title="Slice in plan. Click to recentre."
              >
                Plan
              </button>
              <button
                type="button"
                class="axis"
                data-axis="x"
                aria-pressed="false"
                title="Slice across the tunnel. Click to recentre."
              >
                Cross
              </button>
            </div>
          </div>
          <input
            type="range"
            id="slice-position"
            class="speed-slider slice-slider"
            min="0"
            max="1000"
            step="1"
            value="500"
            aria-label="Position of the flow slice"
          />
          <div class="legend" id="slice-legend">
            <div class="legend-bar"></div>
            <div class="legend-ticks" id="legend-ticks"></div>
            <p class="legend-caption">Local airspeed, m/s — streamlines and slice alike</p>
          </div>
          <p class="flow-status" id="flow-status">Solver starting…</p>
        </div>
      </section>

      <div id="loading" class="loading" hidden><span></span>Building aircraft…</div>

      <footer class="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
